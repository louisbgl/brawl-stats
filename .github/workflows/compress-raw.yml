name: Auto-Compress Raw Data

# Self-healing workflow: If uncompressed .json files appear in data/raw/,
# automatically compress them to .json.gz and delete originals.
#
# Triggers when:
# - VM accidentally pushes uncompressed files
# - Manual commit includes raw .json files
# - Merge from dev branch with uncompressed data

on:
  push:
    branches: [main]
    paths:
      - 'data/raw/snapshots/*.json'
      - 'data/raw/battlelogs/*.json'

jobs:
  compress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run compression migration
        run: |
          # Run migration script to compress any .json files
          python scripts/migrate_to_compressed.py

          # Check if any files were compressed
          if git diff --quiet data/raw/; then
            echo "No uncompressed files found (already compressed)"
            exit 0
          fi

      - name: Commit compressed files
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Stage all changes in data/raw/
          git add data/raw/

          # Commit only if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-compress raw data files to .json.gz

Generated by compress-raw.yml workflow"
            git push
          fi
